<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Starfleet Shooter</title><style>html,body{margin:0;background:#050917;color:white;font-family:system-ui;height:100%;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:absolute;top:12px;left:12px;font-size:14px;pointer-events:none;text-shadow:0 2px 4px #000}#start{position:absolute;inset:0;display:grid;place-items:center;background:#050917bb;text-align:center}button{background:#52baff;border:0;border-radius:12px;padding:16px 26px;font-size:19px;font-weight:bold}small{display:block;margin:20px;line-height:1.6}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="start"><div><h1>🚀 STARFLEET SHOOTER</h1><p>Mission 1 · Enterprise NCC-1701</p><button id="go">Mission starten</button><small>Mit dem Finger das Schiff bewegen.<br>Es feuert automatisch.<br>Alle 100 Abschüsse erscheint eine Superwaffe!</small></div></div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),hud=document.getElementById('hud'),overlay=document.getElementById('start');let W,H,dpr,ship,shots=[],enemies=[],drops=[],sparks=[],stars=[],kills=0,score=0,hp=5,weapon=1,superUntil=0,playing=false,last=0,spawn=0,fire=0,drag=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.4}));if(ship){ship.x=Math.min(W-25,ship.x);ship.y=Math.min(H-30,Math.max(H*.5+20,ship.y))}}addEventListener('resize',resize);resize();
function reset(){ship={x:W/2,y:H*.82,r:20,inv:0};shots=[];enemies=[];drops=[];sparks=[];kills=score=0;hp=5;weapon=1;superUntil=0;spawn=fire=0;playing=true;last=performance.now();overlay.style.display='none';requestAnimationFrame(loop)}document.getElementById('go').onclick=reset;
function move(e){if(!playing)return;ship.x=Math.max(24,Math.min(W-24,e.clientX));ship.y=Math.max(H*.5+24,Math.min(H-28,e.clientY))}c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(drag)move(e)});c.addEventListener('pointerup',()=>drag=false);
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function blast(x,y,color){for(let i=0;i<12;i++)sparks.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,t:.45,color})}
function drawShip(){g.save();g.translate(ship.x,ship.y);if(ship.inv>0&&Math.floor(ship.inv*12)%2===0)g.globalAlpha=.35;g.shadowBlur=18;g.shadowColor='#52cfff';g.fillStyle='#a8bed1';g.beginPath();g.moveTo(0,-29);g.bezierCurveTo(25,-27,28,-12,18,-5);g.lineTo(8,2);g.lineTo(8,22);g.lineTo(-8,22);g.lineTo(-8,2);g.lineTo(-18,-5);g.bezierCurveTo(-28,-12,-25,-27,0,-29);g.fill();g.fillStyle='#e4eaf2';g.beginPath();g.ellipse(0,-15,23,11,0,0,Math.PI*2);g.fill();g.fillStyle='#3e8bd6';g.fillRect(-23,5,7,24);g.fillRect(16,5,7,24);g.fillStyle='#ffae4c';g.fillRect(-21,25,3,7);g.fillRect(18,25,3,7);g.restore()}
function loop(t){if(!playing)return;let dt=Math.min((t-last)/1000,.04);last=t;g.fillStyle='#050917';g.fillRect(0,0,W,H);for(let s of stars){s.y+=s.s*42*dt;if(s.y>H)s.y=0;circle(s.x,s.y,s.s*.65,'#a5b9e0')}spawn-=dt;fire-=dt;if(spawn<=0){spawn=Math.max(.24,.85-kills*.002);enemies.push({x:22+Math.random()*(W-44),y:-25,r:14+Math.random()*8,v:85+Math.random()*65+kills*.3,hp:1+Math.floor(kills/35),w:Math.random()*6})}if(fire<=0){fire=superUntil>t?.085:.18;let n=superUntil>t?5:weapon;for(let i=0;i<n;i++){let a=(i-(n-1)/2)*.15;shots.push({x:ship.x,y:ship.y-25,vx:Math.sin(a)*410,vy:-Math.cos(a)*590,r:superUntil>t?5:3})}}for(let b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;circle(b.x,b.y,b.r,superUntil>t?'#ffe267':'#55e8ff')}shots=shots.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);for(let e of enemies){e.y+=e.v*dt;e.x+=Math.sin(t/320+e.w)*25*dt;g.save();g.translate(e.x,e.y);g.fillStyle='#ec596d';g.beginPath();g.moveTo(0,19);g.lineTo(-e.r,-12);g.lineTo(0,-6);g.lineTo(e.r,-12);g.closePath();g.fill();g.fillStyle='#ffd2d6';g.fillRect(-5,-6,10,8);g.restore();for(let b of shots){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){b.y=-999;e.hp--;if(e.hp<=0){e.dead=true;kills++;score+=100;blast(e.x,e.y,'#ff7890');if(kills%100===0)drops.push({x:e.x,y:e.y,type:'super'});else if(Math.random()<.13)drops.push({x:e.x,y:e.y,type:'weapon'});}break}}if(Math.hypot(ship.x-e.x,ship.y-e.y)<e.r+14&&ship.inv<=0){e.dead=true;hp--;ship.inv=1.5;blast(ship.x,ship.y,'#79caff')}if(e.y>H+30)e.dead=true}enemies=enemies.filter(e=>!e.dead);for(let d of drops){d.y+=100*dt;circle(d.x,d.y,14,d.type==='super'?'#ffca46':'#43dca2');g.fillStyle='#081526';g.font='bold 16px system-ui';g.textAlign='center';g.fillText(d.type==='super'?'S':'W',d.x,d.y+5);if(Math.hypot(ship.x-d.x,ship.y-d.y)<32){d.dead=true;if(d.type==='super')superUntil=t+30000;else weapon=Math.min(5,weapon+1)}}drops=drops.filter(d=>!d.dead&&d.y<H+20);for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;circle(p.x,p.y,2,p.color)}sparks=sparks.filter(p=>p.t>0);ship.inv=Math.max(0,ship.inv-dt);drawShip();hud.innerHTML=`❤️ ${hp} &nbsp; 🎯 ${kills} &nbsp; ⭐ ${score}<br>Waffenstufe ${weapon} · Nächste Superwaffe: ${100-kills%100}${superUntil>t?`<br>⚡ SUPERWAFFE ${Math.ceil((superUntil-t)/1000)} s`:''}`;if(hp<=0){playing=false;overlay.style.display='grid';overlay.querySelector('h1').textContent='Mission beendet';overlay.querySelector('p').textContent=`${kills} Gegner besiegt · ${score} Punkte`;document.getElementById('go').textContent='Erneut starten';return}requestAnimationFrame(loop)}
</script></body></html>
